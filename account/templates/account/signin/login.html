{% extends "layout2.html" %}


{% block title %}
<title>Sign In</title>
{% endblock %}


{% block content %}
<form method="post">
  {% csrf_token %}
  {{ form.non_field_errors }}

  <div class="form-group">
    <label for="{{ form.username.id_for_label }}">Username:</label>
    {{ form.username }}
    {% if form.username.errors %}
      <p class="text-danger">Enter a valid username</p>
    {% endif %}
  </div>

  <!--
  <div class="form-group">
    <label for="{{ form.email.id_for_label }}">Email:</label>
    {{ form.email }}
    {% if form.email.errors %}
      <p class="text-danger">Enter a valid email address</p>
    {% endif %}
  </div>
  -->

  <div class="form-group">
    <label for="{{ form.password.id_for_label }}">Password:</label>
    {{ form.password }}
    {{ form.password.errors }}
  </div>

  <br>
  <button class="btn btn-primary btn-lg btn-block" type="submit">Login</button>

</form><br>

<form action="/account/signup/">
  <button class="btn btn-outline-primary btn-lg btn-block" type="submit">Register</button>
</form><br><br>

<form action="/">
  <button class="btn btn-outline-secondary btn-lg btn-block " type="submit">Back to Home</button>
</form>


{% endblock %}
