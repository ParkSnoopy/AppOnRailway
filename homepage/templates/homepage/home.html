<!DOCTYPE html>
<html>
<head>
  <title>Home</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="/static/favicon.ico">
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" type='text/css' href="/static/css/bootstrap.min.css">
  <script type="text/javascript">
    function controlDeviceWidth() {
      if ( window.innerWidth > 960 ) {
        document.getElementById("main-container").style = "width: 60%; "
        document.getElementById("innerelements-widthcontrol").style = "margin-left: 10%; width: 80%;";
      }
    }
  </script>
</head>
<body onload="controlDeviceWidth()">

<div id="main-container" class="container-lg pt-3">
  <div class="jumbotron text-center">
    <div id="innerelements-widthcontrol">
  		<p class="text-success">
  			{{now}}
  		</p>
      {% if user.is_authenticated %}
				<h5>Welcome!</h5><br>
				<h1>{{nickname}}</h1><br>

				<a href="/public/" class="btn btn-lg btn-success btn-block">파일 공유</a><br>

				{% if user.is_admin %}
					<a class="btn btn-info btn-lg btn-block" href="/admin/" role="button">Admin Page</a><br><br>
				{% elif user.is_leadership %}
					<a class="btn btn-info btn-lg btn-block" href="/update/" role="button">Update Announcement</a><br><br>
				{% endif %}
				<a class="btn btn-info btn-lg btn-block" href="/chat/home/" role="button" style="font-size: 200%;">Chat!</a><br>
				<a class="btn btn-secondary btn-lg btn-block" href="/account/update/{{user.id}}/" role="button">Update Profile</a><br>
				<a class="btn btn-outline-info btn-lg btn-block" href="/account/logout/" role="button">Logout</a><br>
			{% else  %}
				<h1>Welcome!</h1><br>
				<a href="/public/" class="btn btn-lg btn-success btn-block">Public Files</a><br>
				<a class="btn btn-info btn-lg btn-block" href="/account/login/" role="button">Login!</a>
			{% endif %}

      </div>
    </div>
  </div>
</div>

</body>
</html>
